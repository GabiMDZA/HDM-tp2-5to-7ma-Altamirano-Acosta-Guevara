<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Ejercicio 4</title>
    <link rel="stylesheet" href="ListaCompras.css">
</head>

<body>
    <div class="demo-box">
        <span>Ejercicio 4, Lista de Compras</span>
    </div>
    </div>
    <div class="demo-content">
        <div class="field-row">
            <div class="field">
                <label>Nombre del Producto</label>
                <input type="text" id="item-nombre" placeholder="Ej: Macucas">
            </div>
            <div class="field">
                <label>Cantidad</label>
                <input type="number" id="item-cantidad" placeholder="1" min="1" value="1">
            </div>
        </div>
        <div class="field-row">
            <div class="field">
                <label>Precio Unitario ($)</label>
                <input type="number" id="item-precio" min="0" step="1" value="0">
            </div>
            <div class="field">
                <label>Buscar Producto</label>
                <input type="text" id="buscar-item" placeholder="Nombre del producto">
            </div>
        </div>
        <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;">
            <button class="btn" id="btn-agregar">➕ Agregar</button>
            <button class="btn btn-success btn-sm" id="btn-buscar">🔍 Buscar</button>
            <button class="btn btn-sm" id="btn-eliminar">🗑️ Eliminar</button>
            <button class="btn btn-warn btn-sm" id="btn-limpiar">🧹 Limpiar Todo</button>
        </div>
        <div class="output" id="out-lista" style="min-height:40px"></div>

        <div class="lista-container">
            <div class="lista-header">
                <h3>📋 Lista de Compras</h3>
                <div class="total-display" id="total-display">Total: $0.00</div>
            </div>
            <div class="lista-items" id="lista-items">
                <div style="color: #6b7280; text-align: center; padding: 20px;">La lista está vacía</div>
            </div>
        </div>
    </div>
    </div>

    <script src="ListaCompras.js"></script>
</body>

</html>
