<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 5</title>
  <link rel="stylesheet" href="biblioteca.css">
</head>
<body>
  <div class="demo-box">
    <div class="demo-bar">
      <div class="dot dot-r"></div>
      <div class="dot dot-y"></div>
      <div class="dot dot-g"></div>
      <span>ejercicio 5, sistema de biblioteca</span>
    </div>
    <div class="demo-content">

      <div class="field-row">
        <div class="field">
          <label>Título</label>
          <input id="l-titulo" type="text" placeholder="El Libro Troll">
        </div>
        <div class="field">
          <label>Autor</label>
          <input id="l-autor" type="text" placeholder="ElRubius">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>Año</label>
          <input id="l-anio" type="number" placeholder="2014" min="0">
        </div>
      </div>
      <button class="btn btn-sm" id="btn-agregar-libro">📖 Agregar Libro</button>

      <div class="stats-row" id="stats-row"></div>

      <div class="field-row" style="margin-top:20px">
        <div class="field">
          <label>ID del libro</label>
          <input id="l-id" type="number" placeholder="1" min="1">
        </div>
        <div class="field">
          <label>Persona</label>
          <input id="l-persona" type="text" placeholder="Gustavo Guevara">
        </div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="btn btn-success btn-sm" id="btn-prestar">🤝 Prestar</button>
        <button class="btn btn-danger btn-sm" id="btn-devolver">📥 Devolver</button>
      </div>

      <div class="catalogo-lista" id="catalogo-lista" style="margin-top:20px">
        <div class="catalogo-vacio">No hay libros cargados</div>
      </div>

      <div class="output" id="out-biblioteca" style="margin-top:12px"></div>
    </div>
  </div>

  <script src="biblioteca.js"></script>
</body>
</html>
