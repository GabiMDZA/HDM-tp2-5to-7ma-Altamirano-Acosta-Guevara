<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio 7</title>
  <link rel="stylesheet" href="banco.css">
</head>
<body>
  <div class="demo-box">
    <div class="demo-bar">
      <div class="dot dot-r"></div>
      <div class="dot dot-y"></div>
      <div class="dot dot-g"></div>
      <span>ejercicio 7, cuenta bancaria y cosos privados</span>
    </div>
    <div class="demo-content">
      <div class="field-row">
        <div class="field">
          <label>Titular</label>
          <input id="b-titular" type="text" placeholder="Sebas Motta">
        </div>
        <div class="field">
          <label>Saldo inicial ($)</label>
          <input id="b-inicial" type="number" placeholder="6700" min="0">
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label>PIN (4 dígitos)</label>
          <input id="b-pin" type="password" placeholder="1234" maxlength="4" min="0" max="9999">
        </div>
      </div>
      <button class="btn btn-sm" id="btn-crear-cuenta">🏦 Crear Cuenta</button>

      <div class="bank-display" id="bank-display" style="margin-top:16px;display:none">
        <div class="bd-label">Titular</div>
        <div class="bd-user" id="bd-user"></div>
        <div class="bd-label" style="margin-top:10px">Saldo disponible</div>
        <div class="bd-amount" id="bd-amount">$0</div>
        <div class="tx-log" id="tx-log"></div>
      </div>

      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px">
        <input id="b-monto" type="number" placeholder="Monto $" min="1" style="width:120px;background:#1a1a2e;border:1px solid #2d2d44;border-radius:8px;padding:9px 12px;color:#e0e0e0;font-size:14px">
        <input id="b-pin-tx" type="password" placeholder="PIN" maxlength="4" style="width:80px;background:#1a1a2e;border:1px solid #2d2d44;border-radius:8px;padding:9px 12px;color:#e0e0e0;font-size:14px">
        <button class="btn btn-success btn-sm" id="btn-depositar">⬆️ Depositar</button>
        <button class="btn btn-danger btn-sm" id="btn-retirar">⬇️ Retirar</button>
      </div>
      <div class="output" id="out-banco" style="min-height:40px;margin-top:12px"></div>
    </div>
  </div>

  <script src="banco.js"></script>
</body>
</html>
